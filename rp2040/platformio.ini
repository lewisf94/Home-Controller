[env:rp2040]
platform   = https://github.com/maxgerhardt/platform-raspberrypi.git
board      = rpipico
framework  = arduino
; nanopb runtime is vendored at lib/nanopb/ (version-matched to the committed
; .pb files), so it is NOT listed here as a registry dependency.
; SimpleFOCDrivers provides MagneticSensorMT6701SSI (the MT6701 SSI encoder
; class -- the generic MagneticSensorSPI does NOT read the MT6701 correctly).
lib_deps   =
    askuric/Simple FOC @ ^2.3.4
    https://github.com/simplefoc/Arduino-FOC-drivers.git
    bogde/HX711 @ 0.7.5
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit VEML7700 Lib @ ^2.1.6
    adafruit/Adafruit MAX1704X @ ^1.2.2
build_flags =
    -O2
    -DARDUINO_ARCH_RP2040
