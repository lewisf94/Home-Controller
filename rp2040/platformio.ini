[env:rp2040]
; Git dependencies are pinned to a commit so that a clean build is repeatable.
; Move a pin only on purpose, then rebuild and retest the knob.
platform   = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board      = rpipico
framework  = arduino
; nanopb runtime is vendored at lib/nanopb/ (version-matched to the committed
; .pb files), so it is NOT listed here as a registry dependency.
; SimpleFOCDrivers provides MagneticSensorMT6701SSI (the MT6701 SSI encoder
; class -- the generic MagneticSensorSPI does NOT read the MT6701 correctly).
lib_deps   =
    askuric/Simple FOC @ ^2.3.4
    https://github.com/simplefoc/Arduino-FOC-drivers.git#ed05aa1644de36cbd19f43e8ea5c3edb643cefa9
    bogde/HX711 @ 0.7.5
    adafruit/Adafruit NeoPixel @ ^1.12.0
    ; Registry names verified 2026-07-14 (the originals -- "... Lib" and a
    ; nonexistent MAX1704X ^1.2.2 -- failed dependency resolution).
    adafruit/Adafruit VEML7700 Library @ ^2.1.6
    adafruit/Adafruit MAX1704X @ ^1.0.3
build_flags =
    -O2
    -DARDUINO_ARCH_RP2040
