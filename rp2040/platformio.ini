[env:rp2040]
platform   = https://github.com/maxgerhardt/platform-raspberrypi.git
board      = rpipico
framework  = arduino
lib_deps   =
    askuric/Simple FOC @ ^2.3.4
    bogde/HX711 @ 0.7.5
    adafruit/Adafruit NeoPixel @ ^1.12.0
    nanopb/Nanopb @ ~0.4.7
    adafruit/Adafruit VEML7700 Lib @ ^2.1.6
    adafruit/Adafruit MAX1704X @ ^1.2.2
build_flags =
    -O2
    -DARDUINO_ARCH_RP2040
