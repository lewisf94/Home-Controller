## ESP32-P4 (Waveshare 4.3") -- Home Assistant backend build dependencies.
##
## Same board/BSP/LVGL as waveshare/esp-idf/; the Spotify Web API client and
## nanopb (protobuf for knob) are replaced by the HA WebSocket client.
## The vendored BSP (esp32_p4_wifi6_touch_lcd_4_3) pulls lvgl 9.4.0;
## we override it here to 9.5.x to stay on the same version as the non-HA build.
dependencies:
  idf: ">=5.4"
  lvgl/lvgl: "^9.5.0"
  # WiFi via onboard C6 over SDIO (same as non-HA build).
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"
  # Album-art JPEG decode + LittleFS scratch (same as non-HA build).
  bitbank2/jpegdec: "^1.6.2"
  joltwallet/littlefs: "^1.14.8"
  # HA WebSocket client (replaces the direct Spotify HTTP client).
  espressif/esp_websocket_client: ">=1.0.0"
