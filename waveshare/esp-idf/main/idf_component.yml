## ESP32-P4 (Waveshare 4.3") -- direct-Spotify build dependencies.
##
## Deps are added per checkpoint so each stage links on its own (the full
## stack at once overflows internal SRAM -- see main/CMakeLists.txt). The
## vendored BSP pulls lvgl 9.4.0 + st7701 + gt911 + esp_lvgl_adapter itself.
dependencies:
  idf: ">=5.4"
  # Keep Waveshare on LVGL 9.5.x to match the hardware-verified CYD build and
  # avoid the older 9.4.0 pin from the vendored BSP. Runtime tiny_ttf is still
  # disabled in ui.c because the bundled stb_truetype rasterizer crashes on P4.
  lvgl/lvgl: "^9.5.0"
  # --- re-add per checkpoint ---
  # WiFi (cp2): ESP32-P4 has no radio; the onboard ESP32-C6 provides it over SDIO.
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"
  # Album-art JPEG decode + LittleFS scratch (cp5, reused from the CYD build).
  bitbank2/jpegdec: "^1.6.2"
  joltwallet/littlefs: "^1.14.8"
