; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Larger app partition: the embedded 120x120 album thumbnails (~394 KB) plus
; LVGL push the image past the default 1.2 MB app slot.
board_build.partitions = huge_app.csv
; Root-CA bundle for TLS verification (generated from the IDF cacrt_all.pem via
; gen_crt_bundle.py). Referenced by spotify.cpp as _binary_certs_x509_crt_bundle_start.
board_build.embed_files = certs/x509_crt_bundle
lib_deps =
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.0.4
	bitbank2/JPEGDEC@^1.2.8
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	lvgl/lvgl@^9.2.2

build_flags =
	; TFT_eSPI Configuration for standard CYD (ESP32-WROOM, 2.8" ILI9341)
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D TOUCH_CS=-1
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	; LVGL: find lv_conf.h in the project include/ dir. The -I is required so
	; the LVGL *library* sources (not just our src/) pick up lv_conf.h; without
	; it LVGL falls back to its defaults (64 KB static pool, only montserrat_14).
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
build_src_filter = +<*> -<ui_fancy_backup.cpp> -<ui_fancy_backup.h> -<i2c_scanner.cpp>
monitor_speed = 115200

; Diagnostic-only env: builds just src/i2c_scanner.cpp.
; Run with: pio run -e scanner -t upload -t monitor
[env:scanner]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<i2c_scanner.cpp>
monitor_speed = 115200
