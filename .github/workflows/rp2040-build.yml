name: PlatformIO build (RP2040 knob)

# Compile-check the production RP2040 haptic-knob firmware. The platform and
# Git libraries are pinned in rp2040/platformio.ini.
# Actions are pinned to commit SHAs. The comment after each SHA is its tag.

on:
  push:
    paths:
      - 'rp2040/**'
      - 'proto/**'
      - '.github/workflows/rp2040-build.yml'
  pull_request:
    paths:
      - 'rp2040/**'
      - 'proto/**'
      - '.github/workflows/rp2040-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.platformio
          key: pio-rp2040-${{ hashFiles('rp2040/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.2.0"

      - name: Build
        working-directory: rp2040
        run: pio run
